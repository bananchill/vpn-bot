# Alembic configuration for admin-mini-app backend.

[alembic]
# Path to migration scripts, relative to this file
script_location = %(here)s/alembic

# sys.path prepended so that 'config', 'db' etc. are importable
prepend_sys_path = .

# Use os-specific path separator
path_separator = os

# Database URL is set programmatically in env.py from config.DATABASE_URL
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
